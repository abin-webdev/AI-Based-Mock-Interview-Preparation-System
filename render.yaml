services:
  # ----------------------------------------------------
  # DJANGO BACKEND WEB SERVICE
  # ----------------------------------------------------
  - type: web
    name: ai-mock-interview-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn mock_interview_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_SETTINGS_MODULE
        value: mock_interview_backend.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mock-interview-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_CAMERA_ANALYSIS
        value: "True"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

# ----------------------------------------------------
# MANAGED POSTGRESQL DATABASE
# ----------------------------------------------------
databases:
  - name: mock-interview-db
    databaseName: mock_interview
    user: mock_interview_user
    plan: free
    region: oregon
